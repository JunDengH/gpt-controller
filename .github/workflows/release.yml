name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith("v", [StringComparison]::Ordinal)) {
            throw "Release tags must start with a lowercase v."
          }
          $version = $tag.Substring(1)
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Verify release version
        shell: pwsh
        run: ./scripts/verify-version.ps1 -ExpectedVersion "${{ steps.version.outputs.value }}"

      - name: Verify tag is on main
        shell: pwsh
        run: |
          git fetch origin main --no-tags
          $tagCommit = (git rev-parse HEAD).Trim()
          git merge-base --is-ancestor $tagCommit "origin/main"
          if ($LASTEXITCODE -ne 0) {
            throw "Release tags must point to a commit contained in main."
          }

      - name: Restore
        run: dotnet restore GptAccountManager.slnx

      - name: Build
        run: dotnet build GptAccountManager.slnx -c Release --no-restore

      - name: Test
        run: dotnet test GptAccountManager.slnx -c Release --no-build

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Package Windows builds
        shell: pwsh
        run: ./scripts/package.ps1 -Version "${{ steps.version.outputs.value }}"

      - name: Verify release hashes
        shell: pwsh
        run: ./scripts/verify-hashes.ps1

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            Get-ChildItem "artifacts\*.zip", "artifacts\*.exe", `
              "artifacts\*.sha256"
          ) | ForEach-Object FullName
          gh release create "${{ github.ref_name }}" @assets `
            --generate-notes `
            --verify-tag `
            --title "GPT Account Manager ${{ steps.version.outputs.value }}"
