name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Package Windows builds
        shell: pwsh
        run: ./scripts/package.ps1 -Version "${{ steps.version.outputs.value }}"

      - name: Verify release hashes
        shell: pwsh
        run: ./scripts/verify-hashes.ps1

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            Get-ChildItem "artifacts\*.zip", "artifacts\*.exe", `
              "artifacts\*.sha256"
          ) | ForEach-Object FullName
          gh release create "${{ github.ref_name }}" @assets `
            --notes "大幅改进 UI 以及加入新图标" `
            --title "GPT Account Manager ${{ steps.version.outputs.value }}"
