name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Test and package portable build
        shell: pwsh
        run: ./scripts/package.ps1 -Version "${{ steps.version.outputs.value }}"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=${{ steps.version.outputs.value }}" `
            "installer\GptAccountManager.iss"
          $installer = Get-ChildItem "installer\Output\*.exe" | Select-Object -First 1
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content "$($installer.FullName).sha256" "$hash  $($installer.Name)" -Encoding ascii

      - name: Verify release hashes
        shell: pwsh
        run: ./scripts/verify-hashes.ps1

      - name: Smoke test installer
        shell: pwsh
        run: ./scripts/test-installer.ps1

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            Get-ChildItem "artifacts\*.zip", "artifacts\*.sha256", `
              "installer\Output\*.exe", "installer\Output\*.sha256"
          ) | ForEach-Object FullName
          gh release create "${{ github.ref_name }}" @assets `
            --generate-notes `
            --title "GPT Account Manager ${{ steps.version.outputs.value }}"
