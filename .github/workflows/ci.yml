name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Verify source version
        shell: pwsh
        run: ./scripts/verify-version.ps1

      - name: Restore
        run: dotnet restore GptAccountManager.slnx

      - name: Build
        run: dotnet build GptAccountManager.slnx -c Release --no-restore

      - name: Test
        run: dotnet test GptAccountManager.slnx -c Release --no-build

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Package Windows builds
        shell: pwsh
        run: ./scripts/package.ps1 -Version "0.0.0-ci"

      - name: Verify release hashes
        shell: pwsh
        run: ./scripts/verify-hashes.ps1

      - name: Upload packaged builds
        uses: actions/upload-artifact@v4
        with:
          name: windows-builds
          path: |
            artifacts/*.zip
            artifacts/*.sha256
            artifacts/*.exe
